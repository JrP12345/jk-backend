name: healthos-production

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 5000
  MONGODB_URI: ${MONGODB_URI:?Use an authenticated MongoDB replica set or managed MongoDB URI}
  REDIS_URL: ${REDIS_URL:?Use an authenticated Redis URL}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the public frontend origin list}
  APP_URL: ${APP_URL:?Set the public frontend URL}
  FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set the application encryption key}
  JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?Set the production JWT private key}
  JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set the production JWT public key}
  UPI_WEBHOOK_SECRET: ${UPI_WEBHOOK_SECRET:?Set the payment gateway webhook HMAC secret}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-${UPI_WEBHOOK_SECRET}}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Ekavyu}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set the public backend origin}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-50}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-10}

services:
  backend:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  notification-worker:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    command: ["node", "dist/workers/notificationDeliveryWorker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  outbound-message-worker:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    command: ["node", "dist/workers/outboundMessageWorker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  disruption-timeout-worker:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    command: ["node", "dist/workers/disruptionTimeoutWorker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  domain-event-worker:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    command: ["node", "dist/workers/domainEventWorker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  no-show-worker:
    image: ${BACKEND_IMAGE:?Set the backend image tag}
    restart: unless-stopped
    command: ["node", "dist/workers/noShowSweepWorker.js"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5005/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - healthos-net

  frontend:
    image: ${FRONTEND_IMAGE:?Set the frontend image tag}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public backend API URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - healthos-net

networks:
  healthos-net:
    driver: bridge
