name: ekavyu-production

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 5000
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  FRONTEND_URL: ${FRONTEND_URL:-${APP_URL}}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Set PUBLIC_API_BASE_URL in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
  MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-2}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-30}
  RUN_INLINE_JOBS: "false"
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
  PRESCRIPTION_SIGNING_KEY: ${PRESCRIPTION_SIGNING_KEY:?Set the persistent prescription signing key}
  JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?Set JWT_PRIVATE_KEY_BASE64 in .env}
  JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN in .env}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID in .env}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  UPI_WEBHOOK_SECRET: ${UPI_WEBHOOK_SECRET:-${RAZORPAY_WEBHOOK_SECRET:-}}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Ekavyu}
  META_WHATSAPP_WABA_ID: ${META_WHATSAPP_WABA_ID:-}
  META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
  META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
  META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
  META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set the production frontend hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the TLS certificate contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - healthos-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - healthos-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ekavyu-backend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *backend-env
    networks:
      - healthos-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health/readiness > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  notification-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ekavyu-backend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["node", "dist/workers/notificationDeliveryWorker.js"]
    environment:
      <<: *backend-env
      WORKLOAD_ROLE: worker
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PRIVATE_KEY: ""
      PRESCRIPTION_SIGNING_KEY: ""
      GEMINI_API_KEY: ""
      MONGODB_MIN_POOL_SIZE: "0"
      MONGODB_MAX_POOL_SIZE: "5"
    networks:
      - healthos-net
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  outbound-message-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ekavyu-backend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["node", "dist/workers/outboundMessageWorker.js"]
    environment:
      <<: *backend-env
      WORKLOAD_ROLE: worker
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PRIVATE_KEY: ""
      PRESCRIPTION_SIGNING_KEY: ""
      GEMINI_API_KEY: ""
      MONGODB_MIN_POOL_SIZE: "0"
      MONGODB_MAX_POOL_SIZE: "5"
    networks:
      - healthos-net
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5002/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  disruption-timeout-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ekavyu-backend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["node", "dist/workers/disruptionTimeoutWorker.js"]
    environment:
      <<: *backend-env
      WORKLOAD_ROLE: worker
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PRIVATE_KEY: ""
      PRESCRIPTION_SIGNING_KEY: ""
      GEMINI_API_KEY: ""
      MONGODB_MIN_POOL_SIZE: "0"
      MONGODB_MAX_POOL_SIZE: "5"
    networks:
      - healthos-net
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5003/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  domain-event-worker:
    build:
      context: ../
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ekavyu-backend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["node", "dist/workers/domainEventWorker.js"]
    environment:
      <<: *backend-env
      WORKLOAD_ROLE: worker
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PRIVATE_KEY: ""
      PRESCRIPTION_SIGNING_KEY: ""
      GEMINI_API_KEY: ""
      MONGODB_MIN_POOL_SIZE: "0"
      MONGODB_MAX_POOL_SIZE: "5"
    networks:
      - healthos-net
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5004/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL at build time}
    image: ${FRONTEND_IMAGE:-ekavyu-frontend:production}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - healthos-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  healthos-net:
    name: healthos-net
    driver: bridge

volumes:
  redis-data:
    name: ekavyu-redis-data
  caddy-data:
    name: ekavyu-caddy-data
  caddy-config:
    name: ekavyu-caddy-config
